# Invoice API — eigenständiger Betrieb.
# Werte kommen aus .env (siehe .env.example); nichts hier eintragen.
services:
  invoice-api:
    build: .
    image: local/invoice-api:latest
    container_name: invoice-api
    restart: unless-stopped
    env_file: .env
    working_dir: /app
    volumes:
      # Live-Mounts: Code ändern, Container neu starten, kein Neubau.
      - ./app:/app/app:ro
      - ./sql:/app/sql:ro
    ports:
      # Der Dienst hat keine eigene Authentifizierung: standardmäßig nur lokal
      # erreichbar. INVOICE_BIND in .env setzen, wenn eine andere Adresse gemeint ist.
      - "${INVOICE_BIND:-127.0.0.1}:${INVOICE_API_PORT:-8010}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
